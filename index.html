<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>EL GRAN COMBO</title><style>
*{box-sizing:border-box;font-family:sans-serif}html{scroll-behavior:smooth}body{margin:0;background:#faf8f5;color:#2c2520;padding-bottom:90px}header{background:#3e2723;color:#fff;padding:18px 14px;text-align:center}header h1{margin:0;font-size:1.5rem}header p{margin:6px 0 0;font-size:.85rem;color:#d7ccc8}.notice{background:#fef3c7;color:#92400e;font-size:.82rem;text-align:center;padding:8px 12px;border-bottom:1px solid #fde68a}.tabs{display:flex;gap:8px;padding:12px;background:#fff;position:sticky;top:0;overflow-x:auto;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.06);z-index:10;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid #d7ccc8;background:#fff;color:#3e2723;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer;flex-shrink:0;font-size:.9rem}.tab.active{background:#3e2723;color:#fff}.container{max-width:500px;margin:0 auto;padding:15px}.cat-title{margin:18px 0 10px;font-size:1.15rem;color:#3e2723;border-bottom:2px solid #e7e5e4;padding-bottom:4px}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 2px 4px rgba(0,0,0,.05)}.card h3{margin:0 0 4px;font-size:1rem}.card p{margin:0 0 6px;font-size:.82rem;color:#666}.price{font-weight:bold;color:#b45309}.btn-add{background:#b45309;color:#fff;border:none;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer;flex-shrink:0}.qty-box{display:flex;align-items:center;gap:8px;background:#fef3c7;padding:4px 8px;border-radius:8px;border:1px solid #f59e0b;flex-shrink:0}.btn-qty{background:#b45309;color:#fff;border:none;width:28px;height:28px;border-radius:6px;font-weight:bold;font-size:1.1rem;cursor:pointer}.qty-num{font-weight:bold;min-width:18px;text-align:center}.footer{position:fixed;bottom:0;left:0;right:0;background:#3e2723;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:20}.btn-order{background:#25D366;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:bold;cursor:pointer}.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:flex-end;z-index:50}.modal-bg.open{display:flex}.modal{background:#fff;width:100%;max-width:500px;margin:0 auto;border-radius:18px 18px 0 0;padding:20px;max-height:85vh;overflow-y:auto}.item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.modal label{display:block;font-size:.85rem;font-weight:bold;color:#444;margin-top:8px}.modal input,.modal select{width:100%;padding:10px;margin:4px 0 8px;border:1px solid #ccc;border-radius:8px;font-size:1rem}.btn-wa{width:100%;background:#25D366;color:#fff;border:none;padding:14px;border-radius:10px;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:6px}.btn-vaciar{width:100%;background:#f3f4f6;color:#b91c1c;border:1px solid #fca5a5;padding:10px;border-radius:10px;font-size:.9rem;font-weight:bold;cursor:pointer;margin-top:8px}
</style></head><body>
<header><h1 id="t-bar">EL GRAN COMBO</h1><p id="s-bar">C/ La Maya nº 9 (Pardaleras), Badajoz • L-S: 08:00-16:00 y 18:00-00:00</p></header>
<div class="notice">📋 Tapas del día, refrescos adicionales y menú diario disponibles en pizarra del local.</div>
<nav class="tabs" id="nav-tabs"></nav><div class="container" id="lista"></div>
<div class="footer"><div>Total (<span id="cant">0</span>): <strong><span id="tot">0.00</span> €</strong></div><button type="button" class="btn-order" onclick="abrir()">Ver Pedido</button></div>
<div class="modal-bg" id="modal"><div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0">Tu Pedido (<span id="m-tot">0.00</span> €)</h3><button type="button" onclick="cerrar()" style="border:none;background:none;font-size:1.4rem;cursor:pointer">✕</button></div><div id="resumen" style="margin:10px 0;font-size:.95rem"></div><label>Tipo de servicio:</label><select id="tipo"><option value="Mesa">Mesa del local</option><option value="Para llevar">Para llevar</option></select><label>Mesa o nombre:</label><input type="text" id="dato" placeholder="Ej. Mesa 4 o tu nombre"><label>Notas para cocina / barra (opcional):</label><input type="text" id="notas" placeholder="Ej. Pan muy tostado, hielo aparte..."><button type="button" class="btn-wa" onclick="enviarWA()">📲 Enviar por WhatsApp</button><button type="button" class="btn-vaciar" onclick="vaciar()">🗑️ Vaciar todo el pedido</button></div></div>
<script>
var WA = "/34614332550";
var cats = [
  {id:'tostadas', nom:'Tostadas'},
  {id:'cafes', nom:'Cafés'},
  {id:'bocadillos', nom:'Bocadillos'},
  {id:'raciones', nom:'Raciones'},
  {id:'cervezas', nom:'Cervezas'},
  {id:'vinos', nom:'Vinos'},
  {id:'tragos', nom:'Cubatas y Tragos'}
];
var menu = [
  {id:1, cat:'tostadas', nombre:'Tostada Salmorejo (Media)', desc:'Tamaño media tostada', precio:1.4},
  {id:2, cat:'tostadas', nombre:'Tostada Salmorejo (Entera)', desc:'Tamaño tostada entera', precio:2.3},
  {id:3, cat:'tostadas', nombre:'Tostada York y Queso (Media)', desc:'Tamaño media tostada', precio:2.1},
  {id:4, cat:'tostadas', nombre:'Tostada York y Queso (Entera)', desc:'Tamaño tostada entera', precio:3.9},
  {id:5, cat:'tostadas', nombre:'Tostada York y Queso Curado (Media)', desc:'Tamaño media tostada', precio:2.3},
  {id:6, cat:'tostadas', nombre:'Tostada York y Queso Curado (Entera)', desc:'Tamaño tostada entera', precio:4.1},
  {id:7, cat:'tostadas', nombre:'Tostada Aguacate y Huevo (Media)', desc:'Tamaño media tostada', precio:2.5},
  {id:8, cat:'tostadas', nombre:'Tostada Aguacate y Huevo (Entera)', desc:'Tamaño tostada entera', precio:4.5},
  {id:9, cat:'tostadas', nombre:'Tostada Lacón (Media)', desc:'Tamaño media tostada', precio:3.0},
  {id:10, cat:'tostadas', nombre:'Tostada Lacón (Entera)', desc:'Tamaño tostada entera', precio:5.2},
  {id:11, cat:'cafes', nombre:'Bica', desc:'Café solo estilo portugués', precio:1.2},
  {id:12, cat:'cafes', nombre:'Descafeinado de máquina con leche', desc:'Taza caliente', precio:1.5},
  {id:13, cat:'cafes', nombre:'Café Doble', desc:'Carga doble', precio:2.0},
  {id:14, cat:'bocadillos', nombre:'Bocadillo Bacon y Queso', desc:'Recién hecho', precio:5.0},
  {id:15, cat:'bocadillos', nombre:'Bocadillo Queso Curado', desc:'Pan crujiente', precio:6.0},
  {id:16, cat:'bocadillos', nombre:'Bocadillo Chorizo Ibérico', desc:'Ibérico de bellota', precio:6.0},
  {id:17, cat:'bocadillos', nombre:'Bocadillo Calamares', desc:'Calamares fritos', precio:7.0},
  {id:18, cat:'bocadillos', nombre:'Bocadillo Jamón Ibérico', desc:'Jamón ibérico al corte', precio:10.0},
  {id:19, cat:'raciones', nombre:'Ensalada', desc:'Ración completa', precio:10.0},
  {id:20, cat:'raciones', nombre:'Cazón', desc:'Ración en adobo', precio:11.0},
  {id:21, cat:'cervezas', nombre:'Quinto Amstel', desc:'Botellín 20 cl bien frío', precio:1.5},
  {id:22, cat:'cervezas', nombre:'Quinto Cruzcampo', desc:'Botellín 20 cl bien frío', precio:1.5},
  {id:23, cat:'cervezas', nombre:'Ladrón de Verano', desc:'Sidra refrescante', precio:2.5},
  {id:24, cat:'cervezas', nombre:'Cubeta Sagres', desc:'Cubo con hielo', precio:10.0},
  {id:25, cat:'cervezas', nombre:'Cubeta Amstel', desc:'Cubo con hielo', precio:12.0},
  {id:26, cat:'vinos', nombre:'Barbadillo (Copa)', desc:'Vino blanco', precio:3.0},
  {id:27, cat:'vinos', nombre:'Barbadillo (Botella)', desc:'Botella 75 cl', precio:15.0},
  {id:28, cat:'vinos', nombre:'Beronia (Copa)', desc:'Rioja', precio:3.0},
  {id:29, cat:'vinos', nombre:'Beronia (Botella)', desc:'Botella 75 cl', precio:15.0},
  {id:30, cat:'vinos', nombre:'Palacio Quemado (Copa)', desc:'Tinto de la tierra', precio:3.0},
  {id:31, cat:'vinos', nombre:'Palacio Quemado (Botella)', desc:'Botella 75 cl', precio:15.0},
  {id:32, cat:'vinos', nombre:'Lambrusco (Copa)', desc:'Vino de aguja', precio:3.5},
  {id:33, cat:'vinos', nombre:'Lambrusco (Botella)', desc:'Botella 75 cl', precio:16.0},
  {id:34, cat:'vinos', nombre:'Mía (Copa)', desc:'Vino afrutado', precio:3.5},
  {id:35, cat:'vinos', nombre:'Mía (Botella)', desc:'Botella 75 cl', precio:16.0},
  {id:36, cat:'tragos', nombre:'Punt e Mes / Puntemiño (Chupito)', desc:'Aperitivo vermú', precio:1.5},
  {id:37, cat:'tragos', nombre:'Punt e Mes / Puntemiño (Copa)', desc:'Copa servida', precio:4.5},
  {id:38, cat:'tragos', nombre:'Baileys (Chupito)', desc:'Crema irlandesa', precio:2.0},
  {id:39, cat:'tragos', nombre:'Baileys (Copa)', desc:'Con hielo', precio:4.0},
  {id:40, cat:'tragos', nombre:'Amarguinha (Chupito)', desc:'Licor de almendra amarga', precio:3.5},
  {id:41, cat:'tragos', nombre:'Amarguinha (Copa)', desc:'Con hielo y limón', precio:5.0}
];
var filtroActual = 'todos';
var cantidades = {};

var tabsHTML = '<button type="button" class="tab active" onclick="filtrar(\'todos\',this)">Todos</button>';
for (var i = 0; i < cats.length; i++) {
  tabsHTML += '<button type="button" class="tab" onclick="filtrar(\'' + cats[i].id + '\',this)">' + cats[i].nom + '</button>';
}
document.getElementById('nav-tabs').innerHTML = tabsHTML;

function tarjetaHTML(p) {
  var q = cantidades[p.id] || 0;
  var btn = q === 0
    ? '<button type="button" class="btn-add" onclick="cambiar(' + p.id + ',1)">+ Añadir</button>'
    : '<div class="qty-box"><button type="button" class="btn-qty" onclick="cambiar(' + p.id + ',-1)">-</button><span class="qty-num">' + q + '</span><button type="button" class="btn-qty" onclick="cambiar(' + p.id + ',1)">+</button></div>';
  return '<div class="card"><div><h3>' + p.nombre + '</h3><p>' + p.desc + '</p><div class="price">' + p.precio.toFixed(2) + ' €</div></div>' + btn + '</div>';
}

function render() {
  var html = '';
  for (var i = 0; i < cats.length; i++) {
    var c = cats[i];
    if (filtroActual !== 'todos' && filtroActual !== c.id) continue;
    var itemsHTML = '';
    for (var j = 0; j < menu.length; j++) {
      if (menu[j].cat === c.id) itemsHTML += tarjetaHTML(menu[j]);
    }
    if (itemsHTML !== '') {
      if (filtroActual === 'todos') html += '<h2 class="cat-title">' + c.nom + '</h2>';
      html += itemsHTML;
    }
  }
  document.getElementById('lista').innerHTML = html;
}

function filtrar(c, b) {
  filtroActual = c;
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  b.classList.add('active');
  render();
}

function cambiar(id, d) {
  var nueva = (cantidades[id] || 0) + d;
  if (nueva <= 0) delete cantidades[id];
  else cantidades[id] = nueva;
  actualizarTotales();
  render();
  if (document.getElementById('modal').classList.contains('open')) abrir();
}

function actualizarTotales() {
  var totalCant = 0;
  var totalPrecio = 0;
  for (var i = 0; i < menu.length; i++) {
    var q = cantidades[menu[i].id] || 0;
    if (q > 0) {
      totalCant += q;
      totalPrecio += menu[i].precio * q;
    }
  }
  document.getElementById('cant').innerText = totalCant;
  document.getElementById('tot').innerText = totalPrecio.toFixed(2);
  document.getElementById('m-tot').innerText = totalPrecio.toFixed(2);
}

function abrir() {
  var html = '';
  for (var i = 0; i < menu.length; i++) {
    var p = menu[i];
    var q = cantidades[p.id] || 0;
    if (q > 0) {
      html += '<div class="item-row"><div><strong>' + q + 'x</strong> ' + p.nombre + '<br><small style="color:#666">' + (p.precio * q).toFixed(2) + ' €</small></div><div class="qty-box"><button type="button" class="btn-qty" onclick="cambiar(' + p.id + ',-1)">-</button><span class="qty-num">' + q + '</span><button type="button" class="btn-qty" onclick="cambiar(' + p.id + ',1)">+</button></div></div>';
    }
  }
  if (html === '') { cerrar(); return; }
  document.getElementById('resumen').innerHTML = html;
  actualizarTotales();
  document.getElementById('modal').classList.add('open');
}

function vaciar() { cantidades = {}; actualizarTotales(); render(); cerrar(); }
function cerrar() { document.getElementById('modal').classList.remove('open'); }

function enviarWA() {
  var tipo = document.getElementById('tipo').value;
  var dato = document.getElementById('dato').value || 'Sin indicar';
  var notas = document.getElementById('notas').value.trim();
  var lineas = [];
  for (var i = 0; i < menu.length; i++) {
    var p = menu[i];
    var q = cantidades[p.id] || 0;
    if (q > 0) lineas.push('• ' + q + 'x ' + p.nombre + ' (' + (p.precio * q).toFixed(2) + ' €)');
  }
  if (!lineas.length) return;
  var msg = '*PEDIDO EL GRAN COMBO*\n' + tipo + ': ' + dato + '\n\n' + lineas.join('\n') + '\n\n*TOTAL: ' + document.getElementById('m-tot').innerText + ' €*';
  if (notas) msg += '\n📝 *Notas:* ' + notas;
  window.location.href = 'https://wa.me' + WA + '?text=' + encodeURIComponent(msg);
}

render();
</script>
</body>
</html>
